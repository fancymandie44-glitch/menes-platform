[project]
name = "ledger-maison"
version = "1.0.0"
description = "Comptabilité personnelle locale — extraction et réconciliation au cent près"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "python-multipart>=0.0.17",
  "sqlalchemy>=2.0",
  "pydantic>=2.9",
  "pdfplumber>=0.11",
  "openpyxl>=3.1",
  "pillow>=11.0",
  "cryptography>=43.0",
  "argon2-cffi>=23.1",
  "pyotp>=2.9",
  "httpx>=0.27",
  "reportlab>=4.2",
]

[project.optional-dependencies]
ocr = ["pytesseract>=0.3.13"]
dev = ["pytest>=8.3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["ledger_maison*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
