[build]
  publish = "."

# Custom domain: mymenesjewelry.com
# Configure DNS at your registrar (see DOMAIN-SETUP.txt)

[[redirects]]
  from = "https://www.mymenesjewelry.com/*"
  to = "https://mymenesjewelry.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
